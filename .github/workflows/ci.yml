name: Evaluation checks
on:
  push:
    branches: [main, master, remediation-review]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install backend and test dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio requests httpx
      - name: Run isolated security and functionality checks
        run: python scripts/run_evaluation_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: docs/verification/
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install locked dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Frontend regression tests
        working-directory: frontend
        run: yarn test --watchAll=false --runInBand
        env:
          CI: true
      - name: Production build
        working-directory: frontend
        run: yarn build
