name: Metechq CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Security & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx requests

      - name: Run Backend Security Tests
        env:
          JWT_SECRET: test_jwt_secret_for_ci_minimum_32_characters_long_1234
          CLIENT_JWT_SECRET: test_client_jwt_secret_for_ci_minimum_32_chars
          ENVIRONMENT: test
          UPLOAD_DIR: /tmp/metechq_uploads
        run: |
          python -m pytest tests/backend/test_comprehensive_security.py -v

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Build production bundle
        working-directory: ./frontend
        run: yarn build
